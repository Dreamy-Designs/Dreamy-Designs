<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dreamy Designs | Laser Cutting & Engraving | Kariega</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--navy:#0a1931;--gold:#d4af37;--light:#f8f5f0}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:var(--light)}
header{background:var(--navy);color:var(--gold);padding:12px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:99}
.logo{font-weight:900;letter-spacing:1px}
.logo span{color:white;font-family:cursive}
.cats{display:flex;gap:10px;overflow-x:auto;padding:18px;background:white;border-bottom:2px solid #eee}
.cats::-webkit-scrollbar{display:none}
.cat{min-width:110px;height:70px;border:1.5px solid #ddd;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:#fff;transition:.2s}
.cat.active,.cat:hover{border-color:var(--gold);background:var(--navy);color:var(--gold)}
.cat i{font-size:20px;margin-bottom:4px}
.cat b{font-size:11px;text-align:center}
#products{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px;padding:18px}
.card{background:white;border-radius:16px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.07);border:1px solid #eee}
.card img{width:100%;height:170px;object-fit:cover}
.card .info{padding:10px}
.card .info h4{font-size:13px;color:var(--navy);height:32px;overflow:hidden}
.price{color:var(--gold);font-weight:800;margin-top:6px}
.btn{width:100%;background:var(--navy);color:var(--gold);border:none;padding:8px;border-radius:8px;margin-top:8px;font-weight:700;cursor:pointer}
footer{background:var(--navy);color:white;text-align:center;padding:20px;margin-top:20px}
footer a{color:var(--gold);text-decoration:none}
</style>
</head>
<body>

<header>
<div class="logo">Dreamy Designs <span>Laser Cutting & Engraving</span></div>
<div><i class="fa-solid fa-cart-shopping"></i> <span id="cartCount">0</span></div>
</header>

<div class="cats">
<div class="cat active" onclick="filterCat('all',this)"><i class="fa-solid fa-border-all"></i><b>VIEW ALL</b></div>
<div class="cat" onclick="filterCat('Home decor',this)"><i class="fa-solid fa-house"></i><b>HOME DECOR</b></div>
<div class="cat" onclick="filterCat('Personalised gifts',this)"><i class="fa-solid fa-gift"></i><b>PERSONALISED GIFTS</b></div>
<div class="cat" onclick="filterCat('Pet tags & accessories',this)"><i class="fa-solid fa-paw"></i><b>PET TAGS</b></div>
<div class="cat" onclick="filterCat('Kitchen & serverware',this)"><i class="fa-solid fa-utensils"></i><b>KITCHEN</b></div>
<div class="cat" onclick="filterCat('Signage & displays',this)"><i class="fa-solid fa-sign-hanging"></i><b>SIGNAGE</b></div>
<div class="cat" onclick="filterCat('Puzzles & educational',this)"><i class="fa-solid fa-puzzle-piece"></i><b>PUZZLES</b></div>
<div class="cat" onclick="filterCat('Industrial & prototyping',this)"><i class="fa-solid fa-industry"></i><b>INDUSTRIAL</b></div>
<div class="cat" onclick="filterCat('Sport',this)"><i class="fa-solid fa-medal"></i><b>SPORT</b></div>
<div class="cat" onclick="filterCat('Awards',this)"><i class="fa-solid fa-trophy"></i><b>AWARDS</b></div>
</div>

<div id="products"></div>

<footer>
<p>📲 WhatsApp: <a href="https://wa.me/27645464275">064 546 4275</a> | Kariega</p>
<p style="margin-top:8px;font-size:12px;opacity:.7">© 2026 Dreamy Designs - We Create What You Imagine</p>
</footer>

<script>
let allProducts = JSON.parse(localStorage.getItem('dreamy_products')||'[]');
if(allProducts.length===0){
allProducts=[
{name:"Custom Wooden Trophy - Sport",price:250,category:"Sport",img:"https://via.placeholder.com/300x300?text=Sport+Trophy"},
{name:"Excellence Award Trophy",price:320,category:"Awards",img:"https://via.placeholder.com/300x300?text=Award+Trophy"},
];
}
function render(list){
document.getElementById('products').innerHTML=list.map(p=>`
<div class="card">
<img src="${p.img}">
<div class="info">
<h4>${p.name}</h4>
<div class="price">R${p.price}</div>
<button class="btn" onclick="order('${p.name}')">Order on WhatsApp</button>
</div>
</div>`).join('');
}
function filterCat(cat,el){
document.querySelectorAll('.cat').forEach(c=>c.classList.remove('active'));
el.classList.add('active');
if(cat==='all') render(allProducts);
else render(allProducts.filter(p=>p.category.toLowerCase()===cat.toLowerCase()));
}
function order(name){window.open(`https://wa.me/27645464275?text=Hi Dreamy Designs, I want to order ${name}`,'_blank')}
render(allProducts);
</script>
</body>
</html>
