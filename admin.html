<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dreamy Designs - AUTO Admin</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:#fdfaf6}
:root{--navy:#0b2142;--gold:#c9a86a;--line:#e8d5b8}
.top{background:var(--navy);color:white;text-align:center;padding:32px 20px 26px}
.top h1{font-family:'Brush Script MT',cursive;font-size:38px;font-weight:400}
.top small{display:block;font-family:Arial;font-size:11px;letter-spacing:4px;color:var(--gold);margin-top:6px}
.top p{margin-top:10px;color:var(--gold);letter-spacing:2px;font-size:12px;font-weight:700}
.container{max-width:900px;margin:-18px auto 40px;background:white;padding:28px;border-radius:16px;box-shadow:0 10px 30px rgba(11,33,66,0.12);border:1px solid var(--line)}
label{display:block;margin-top:18px;font-weight:700;color:var(--navy);font-size:13px}
select,input,textarea{width:100%;padding:12px;margin-top:6px;background:#fdfaf6;border:1px solid var(--line);border-radius:10px;font-size:14px}
button.main{background:var(--navy);color:var(--gold);padding:14px;border:none;border-radius:10px;font-weight:800;width:100%;margin-top:20px;cursor:pointer}
button.cloud{background:var(--gold);color:var(--navy);padding:12px;border:none;border-radius:10px;font-weight:800;width:100%;margin-top:10px;cursor:pointer}
button.sec{background:white;color:var(--navy);border:1px solid var(--line);padding:12px;border-radius:10px;width:100%;margin-top:10px;cursor:pointer}
.preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:12px}
.preview img{width:100%;height:110px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.item{background:#fdfaf6;padding:14px;border-radius:12px;margin-bottom:10px;display:flex;gap:14px;align-items:center;border:1px solid var(--line)}
.item img{width:68px;height:68px;object-fit:cover;border-radius:8px}
.badge{background:var(--navy);color:var(--gold);padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.status{padding:10px;border-radius:8px;margin-top:10px;text-align:center;font-weight:700;display:none}
.status.ok{background:#d4edda;color:#155724;display:block}
.status.err{background:#f8d7da;color:#721c24;display:block}
</style>
</head>
<body>
<div class="top"><h1>Dreamy Designs<small>AUTO-CLOUD ADMIN</small></h1><p>AUTO UPDATES LIVE SITE</p></div>
<div class="container">
<label>GitHub Token (1 time setup)</label>
<input id="token" type="password" placeholder="Paste ghp_ token here - saved on this device only">
<button class="sec" onclick="saveToken()">Save Token</button>
<div id="status" class="status"></div>

<button class="cloud" onclick="loadFromCloud()"><i class="fa-solid fa-cloud-arrow-down"></i> LOAD FROM GITHUB</button>

<label>Category *</label>
<select id="category">
<option value="Home decor">HOME DECOR</option>
<option value="Personalised gifts">PERSONALISED GIFTS</option>
<option value="Pet tags & accessories">PET TAGS & ACCESSORIES</option>
<option value="Kitchen & serverware">KITCHEN & SERVERWARE</option>
<option value="Signage & displays">SIGNAGE & DISPLAYS</option>
<option value="Puzzles & educational">PUZZLES & EDUCATIONAL</option>
<option value="Industrial & prototyping">INDUSTRIAL & PROTOTYPING</option>
<option value="Sport">SPORT</option>
<option value="Awards">AWARDS</option>
</select>
<label>Product Name *</label><input id="name" placeholder="e.g. NMA Trophy">
<label>Description</label><textarea id="desc" rows="3"></textarea>
<label>Photos *</label><input type="file" id="photos" multiple accept="image/*">
<div id="preview" class="preview"></div>
<button class="main" onclick="addProductAuto()"><i class="fa-solid fa-rocket"></i> ADD & AUTO UPDATE LIVE SITE</button>
<button class="sec" onclick="window.open('https://dreamy-designs.github.io/Dreamy-Designs/','_blank')">View Live Site</button>
<div id="productList" style="margin-top:28px"></div>
</div>
<script>
const OWNER='dreamy-designs';const REPO='Dreamy-Designs';const PATH='products.json';
let products=JSON.parse(localStorage.getItem('dreamy_products')||'[]');let tempImages=[];
document.getElementById('token').value=localStorage.getItem('gh_token')||'';
function saveToken(){const t=document.getElementById('token').value.trim();if(!t.startsWith('ghp_')){showStatus('Invalid token! Must start with ghp_','err');return;}localStorage.setItem('gh_token',t);showStatus('Token saved! Now you can auto-update!','ok');}
function showStatus(m,c){const s=document.getElementById('status');s.textContent=m;s.className='status '+c;s.style.display='block';setTimeout(()=>s.style.display='none',4000);}
async function loadFromCloud(){try{const r=await fetch(`https://raw.githubusercontent.com/${OWNER}/${REPO}/main/${PATH}?t=`+Date.now());const d=await r.json();products=d;localStorage.setItem('dreamy_products',JSON.stringify(products));render();showStatus('Loaded '+d.length+' from GitHub!','ok');}catch(e){showStatus('Failed to load - check products.json exists','err');}}
document.getElementById('photos').addEventListener('change',e=>{tempImages=[];document.getElementById('preview').innerHTML='';Array.from(e.target.files).forEach(f=>{const rd=new FileReader();rd.onload=ev=>{tempImages.push(ev.target.result);const im=document.createElement('img');im.src=ev.target.result;document.getElementById('preview').appendChild(im);};rd.readAsDataURL(f);});});
async function uploadToGitHub(){
 const token=localStorage.getItem('gh_token');if(!token){showStatus('Add GitHub token first!','err');return false;}
 try{
  let sha=null;try{const getRes=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`,{headers:{Authorization:`token ${token}`}});if(getRes.ok){const j=await getRes.json();sha=j.sha;}}catch(e){}
  const content=btoa(unescape(encodeURIComponent(JSON.stringify(products,null,2))));
  const res=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`,{method:'PUT',headers:{Authorization:`token ${token}`,'Content-Type':'application/json'},body:JSON.stringify({message:'Auto update products - '+new Date().toISOString(),content,sha})});
  if(!res.ok){const err=await res.text();throw new Error(err);}
  showStatus('LIVE SITE UPDATED! Wait 60 sec then refresh site!','ok');return true;
 }catch(e){showStatus('Auto upload failed: '+e.message,'err');console.error(e);return false;}
}
async function addProductAuto(){
 const cat=document.getElementById('category').value;const name=document.getElementById('name').value.trim();const desc=document.getElementById('desc').value.trim();
 if(!name||tempImages.length===0){alert('Add name + photo!');return;}
 products.unshift({id:Date.now(),category:cat,name,desc,images:tempImages});localStorage.setItem('dreamy_products',JSON.stringify(products));render();
 document.getElementById('name').value='';document.getElementById('desc').value='';document.getElementById('preview').innerHTML='';tempImages=[];
 await uploadToGitHub();
}
function render(){const l=document.getElementById('productList');l.innerHTML='<h3>Products ('+products.length+')</h3>';products.forEach((p,i)=>{l.innerHTML+=`<div class="item"><img src="${p.images[0]}"><div style="flex:1"><span class="badge">${p.category}</span><div style="font-weight:bold">${p.name}</div></div><button onclick="if(confirm('Delete?')){products.splice(${i},1);localStorage.setItem('dreamy_products',JSON.stringify(products));render();uploadToGitHub();}" style="padding:6px 10px;background:#c94a4a;color:white;border:none;border-radius:6px">X</button></div>`;});}
render();
</script>
</body>
</html>
