<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dreamy Designs | Custom Laser Creations</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial;background:#fdfaf6;color:#0b2142}
:root{--navy:#0b2142;--gold:#c9a86a;--line:#e8d5b8}
header{background:var(--navy);color:white;text-align:center;padding:40px 20px}
header h1{font-family:'Brush Script MT',cursive;font-size:52px;font-weight:400}
header small{display:block;font-family:Arial;font-size:12px;letter-spacing:5px;color:var(--gold);margin-top:4px}
nav{position:sticky;top:0;z-index:99;background:white;border-bottom:1px solid var(--line);display:flex;gap:8px;overflow:auto;padding:10px 16px}
nav button{white-space:nowrap;padding:8px 16px;border-radius:20px;border:1px solid var(--line);background:#fdfaf6;font-weight:700;color:var(--navy);cursor:pointer}
nav button.active{background:var(--navy);color:var(--gold)}
.hero{text-align:center;padding:40px 20px}
.hero h2{font-size:28px;margin-bottom:8px}
.hero p{color:#6b6b6b}
.grid{max-width:1200px;margin:20px auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;padding:0 16px}
.card{background:white;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.05)}
.card img{width:100%;height:220px;object-fit:cover}
.card-body{padding:14px}
.badge{display:inline-block;background:var(--navy);color:var(--gold);padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;margin-bottom:6px}
.card-body h3{font-size:16px;margin:4px 0}
.card-body p{font-size:13px;color:#666}
.whatsapp{position:fixed;bottom:20px;right:20px;background:#25D366;color:white;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 4px 12px rgba(0,0,0,.2);z-index:100}
footer{background:var(--navy);color:var(--gold);text-align:center;padding:20px;margin-top:40px;font-size:13px}
</style>
</head>
<body>
<header><h1>Dreamy Designs<small>CUSTOM LASER CREATIONS</small></h1></header>
<nav id="cats">
<button class="active" onclick="filter('all')">All</button>
<button onclick="filter('Home decor')">Home Decor</button>
<button onclick="filter('Personalised gifts')">Personalised Gifts</button>
<button onclick="filter('Pet tags & accessories')">Pet Tags</button>
<button onclick="filter('Kitchen & serverware')">Kitchen</button>
<button onclick="filter('Signage & displays')">Signage</button>
<button onclick="filter('Puzzles & educational')">Puzzles</button>
<button onclick="filter('Industrial & prototyping')">Industrial</button>
<button onclick="filter('Sport')">Sport</button>
<button onclick="filter('Awards')">Awards</button>
</nav>
<div class="hero"><h2>Handcrafted with Love</h2><p>Unique laser-cut creations for every occasion</p></div>
<div id="grid" class="grid"></div>
<a class="whatsapp" href="https://wa.me/27600000000" target="_blank"><i class="fa-brands fa-whatsapp"></i></a>
<footer>© 2025 Dreamy Designs | Uitenhage, Eastern Cape | <a href="admin.html" style="color:var(--gold)">Admin</a></footer>
<script>
const OWNER='dreamy-designs',REPO='Dreamy-Designs',PATH='products.json';
let allProducts=[],active='all';
async function load(){
 try{
  let r=await fetch(`https://raw.githubusercontent.com/${OWNER}/${REPO}/main/${PATH}?t=${Date.now()}`);
  if(!r.ok) throw new Error('No products.json yet');
  allProducts=await r.json();
 }catch(e){
  // fallback to localStorage if GitHub fails
  allProducts=JSON.parse(localStorage.getItem('dreamy_products')||'[]');
 }
 // also merge localStorage newer items
 let local=JSON.parse(localStorage.getItem('dreamy_products')||'[]');
 if(local.length>allProducts.length){allProducts=local;}
 render();
}
function render(){
 let g=document.getElementById('grid');g.innerHTML='';
 let filtered=active==='all'?allProducts:allProducts.filter(p=>p.category===active);
 if(filtered.length===0){g.innerHTML='<p style="grid-column:1/-1;text-align:center;padding:40px;color:#999">No products in this category yet. Check back soon!</p>';return;}
 filtered.forEach(p=>{
  let img=p.images&&p.images[0]?p.images[0]:'https://via.placeholder.com/300';
  g.innerHTML+=`<div class="card"><img src="${img}" alt="${p.name}"><div class="card-body"><span class="badge">${p.category}</span><h3>${p.name}</h3><p>${p.desc||''}</p></div></div>`;
 });
}
function filter(c){
 active=c;
 document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
 event.target.classList.add('active');
 render();
}
load();
</script>
</body>
</html>
