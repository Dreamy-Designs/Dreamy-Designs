<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dreamy Designs - Admin</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:#fdfaf6;color:#1a1a1a}
:root{--navy:#0b2142;--gold:#c9a86a;--cream:#fdfaf6;--line:#e8d5b8}
.top{background:var(--navy);color:white;text-align:center;padding:32px 20px 26px}
.top h1{font-family:'Brush Script MT',cursive;font-size:38px;font-weight:400}
.top h1 small{display:block;font-family:Arial,sans-serif;font-size:11px;letter-spacing:4px;font-weight:700;color:var(--gold);margin-top:6px}
.top p{margin-top:10px;color:var(--gold);letter-spacing:2px;font-size:12px;font-weight:700}
.divider{width:80px;height:2px;background:var(--gold);margin:12px auto 0}
.container{max-width:900px;margin:-18px auto 40px;background:white;padding:28px;border-radius:16px;box-shadow:0 10px 30px rgba(11,33,66,0.12);border:1px solid var(--line)}
label{display:block;margin-top:18px;font-weight:700;color:var(--navy);font-size:13px;letter-spacing:0.6px}
select,input,textarea{width:100%;padding:12px;margin-top:6px;background:#fdfaf6;border:1px solid var(--line);border-radius:10px;box-sizing:border-box;font-size:14px}
button.main{background:var(--navy);color:var(--gold);padding:14px 24px;border:none;border-radius:10px;font-weight:800;cursor:pointer;width:100%;margin-top:20px;font-size:15px;letter-spacing:0.5px}
button.main:hover{background:#081a36}
button.sec{background:white;color:var(--navy);border:1px solid var(--line);padding:12px 24px;border-radius:10px;cursor:pointer;width:100%;margin-top:10px;font-weight:700}
.preview{margin-top:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.preview img{width:100%;height:110px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.item{background:#fdfaf6;padding:14px;border-radius:12px;margin-bottom:10px;display:flex;gap:14px;align-items:center;border:1px solid var(--line)}
.item img{width:68px;height:68px;object-fit:cover;border-radius:8px}
.badge{background:var(--navy);color:var(--gold);padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.footer{background:var(--navy);color:white;padding:18px;text-align:center;margin-top:30px;border-radius:12px}
</style>
</head>
<body>
<div class="top">
<h1>Dreamy Designs<small>LASER CUTTING AND ENGRAVING — ADMIN</small></h1>
<p>WE CREATE WHAT YOU IMAGINE</p>
<div class="divider"></div>
</div>
<div class="container">
<label><i class="fa-solid fa-table-cells-large"></i> Category *</label>
<select id="category">
<option value="Home decor">HOME DECOR</option>
<option value="Personalised gifts">PERSONALISED GIFTS</option>
<option value="Pet tags & accessories">PET TAGS & ACCESSORIES</option>
<option value="Kitchen & serverware">KITCHEN & SERVERWARE</option>
<option value="Signage & displays">SIGNAGE & DISPLAYS</option>
<option value="Puzzles & educational">PUZZLES & EDUCATIONAL ITEMS</option>
<option value="Industrial & prototyping">INDUSTRIAL & PROTOTYPE CUTTING</option>
<option value="Sport">SPORT</option>
<option value="Awards">AWARDS</option>
</select>
<label><i class="fa-solid fa-tag"></i> Product Name *</label>
<input id="name" placeholder="e.g. Home is our happy place">
<label><i class="fa-solid fa-align-left"></i> Description</label>
<textarea id="desc" rows="3" placeholder="Laser cut from... size... custom available..."></textarea>
<label><i class="fa-solid fa-images"></i> Product Photos * (Multiple allowed)</label>
<input type="file" id="photos" multiple accept="image/*">
<div id="preview" class="preview"></div>
<button class="main" onclick="addProduct()"><i class="fa-solid fa-plus"></i> Add Product to Website</button>
<button class="sec" onclick="downloadJSON()"><i class="fa-solid fa-download"></i> Download products.json (Upload to GitHub)</button>
<button class="sec" onclick="window.open('https://dreamy-designs.github.io/Dreamy-Designs/','_blank')"><i class="fa-solid fa-eye"></i> View Live Site</button>
<div id="productList" style="margin-top:28px"></div>
<div class="footer" style="margin-top:30px">
<div style="font-size:13px"><i class="fa-solid fa-phone" style="color:var(--gold)"></i> 064 546 4275 &nbsp; <i class="fa-solid fa-location-dot" style="color:var(--gold)"></i> Kariega</div>
<div style="margin-top:10px;letter-spacing:2px;font-size:10px;color:var(--gold);font-weight:700">PRECISION • PASSION • PERSONALISATION</div>
</div>
</div>
<script>
let products=JSON.parse(localStorage.getItem('dreamy_products')||'[]');let tempImages=[];
document.getElementById('photos').addEventListener('change',function(e){
 tempImages=[];document.getElementById('preview').innerHTML='';
 Array.from(e.target.files).forEach(file=>{const reader=new FileReader();reader.onload=function(ev){tempImages.push(ev.target.result);const img=document.createElement('img');img.src=ev.target.result;document.getElementById('preview').appendChild(img);};reader.readAsDataURL(file);});
});
function addProduct(){
 const cat=document.getElementById('category').value;const name=document.getElementById('name').value.trim();const desc=document.getElementById('desc').value.trim();
 if(!name||tempImages.length===0){alert('Add name + at least 1 photo!');return;}
 products.unshift({id:Date.now(),category:cat,name,desc,images:tempImages});localStorage.setItem('dreamy_products',JSON.stringify(products));render();
 document.getElementById('name').value='';document.getElementById('desc').value='';document.getElementById('preview').innerHTML='';tempImages=[];
 alert('Added! Now click Download products.json and upload it to GitHub.');
}
function render(){
 const list=document.getElementById('productList');list.innerHTML='<h3 style="margin-bottom:12px;color:#0b2142"><i class="fa-solid fa-box"></i> Added Products ('+products.length+')</h3>';
 products.forEach((p,i)=>{list.innerHTML+=`<div class="item"><img src="${p.images[0]}"><div style="flex:1"><span class="badge">${p.category}</span><div style="font-weight:bold;margin-top:4px;color:#0b2142">${p.name}</div><div style="font-size:12px;color:#8a7a6a">${p.desc.substring(0,70)}</div></div><button onclick="removeProduct(${i})" style="width:auto;padding:8px 12px;background:#c94a4a;color:white;border:none;border-radius:8px;cursor:pointer">X</button></div>`;});
}
function removeProduct(i){if(confirm('Remove this?')){products.splice(i,1);localStorage.setItem('dreamy_products',JSON.stringify(products));render();}}
function downloadJSON(){if(products.length===0){alert('No products to download!');return;}const dataStr="data:text/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(products,null,2));const a=document.createElement('a');a.href=dataStr;a.download="products.json";a.click();}
render();
</script>
</body>
</html>
