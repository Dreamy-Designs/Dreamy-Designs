<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dreamy Designs - Admin</title>
<style>
body{font-family:Arial,sans-serif;background:#0f0f0f;color:#fff;padding:20px}
h1{color:#d4af37;text-align:center}
.container{max-width:900px;margin:0 auto;background:#1a1a1a;padding:20px;border-radius:12px;border:1px solid #d4af37}
label{display:block;margin-top:15px;color:#d4af37;font-weight:bold}
select,input,textarea{width:100%;padding:12px;margin-top:5px;background:#2a2a2a;color:#fff;border:1px solid #444;border-radius:8px;box-sizing:border-box}
button{background:linear-gradient(135deg,#d4af37,#b8962e);color:#000;padding:14px 24px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;width:100%;margin-top:20px;font-size:16px}
button:hover{opacity:0.9}
.preview{margin-top:15px;display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.preview img{width:100%;height:120px;object-fit:cover;border-radius:8px;border:1px solid #d4af37}
.product-list{margin-top:30px}
.item{background:#222;padding:15px;border-radius:8px;margin-bottom:10px;display:flex;gap:15px;align-items:center}
.item img{width:80px;height:80px;object-fit:cover;border-radius:6px}
.cat-badge{background:#d4af37;color:#000;padding:3px 8px;border-radius:12px;font-size:11px;font-weight:bold}
</style>
</head>
<body>
<h1>✨ Dreamy Designs Admin</h1>
<div class="container">
<label>Category *</label>
<select id="category">
<option value="Home decor">Home decor</option>
<option value="Personalized gifts">Personalized gifts</option>
<option value="Pet tags & accessories">Pet tags & accessories</option>
<option value="Kitchen & serverware">Kitchen & serverware</option>
<option value="Signage & displays">Signage & displays</option>
<option value="Puzzles & educational">Puzzles & educational</option>
<option value="Industrial & prototyping">Industrial & prototyping</option>
</select>

<label>Product Name *</label>
<input id="name" placeholder="e.g. Custom Wooden Sign">

<label>Description</label>
<textarea id="desc" rows="3" placeholder="Tell customers about this product..."></textarea>

<label>Product Photos * (Multiple)</label>
<input type="file" id="photos" multiple accept="image/*">
<div id="preview" class="preview"></div>

<button onclick="addProduct()">+ Add Product to Website</button>
<button onclick="downloadJSON()" style="background:#333;color:#d4af37;border:1px solid #d4af37;margin-top:10px">💾 Download products.json (Upload to GitHub)</button>
<button onclick="viewSite()" style="background:#111;color:#fff;border:1px solid #444">🌐 View Live Site</button>

<div class="product-list" id="productList"></div>
</div>

<script>
let products = JSON.parse(localStorage.getItem('dreamy_products') || '[]');
let tempImages = [];
document.getElementById('photos').addEventListener('change', function(e){
  tempImages=[]; document.getElementById('preview').innerHTML='';
  Array.from(e.target.files).forEach(file=>{
    const reader=new FileReader();
    reader.onload=function(ev){
      tempImages.push(ev.target.result);
      const img=document.createElement('img');
      img.src=ev.target.result;
      document.getElementById('preview').appendChild(img);
    };
    reader.readAsDataURL(file);
  });
});
function addProduct(){
  const cat=document.getElementById('category').value;
  const name=document.getElementById('name').value.trim();
  const desc=document.getElementById('desc').value.trim();
  if(!name || tempImages.length===0){alert('Please add product name and at least 1 photo!');return;}
  products.unshift({id:Date.now(),category:cat,name,desc,images:tempImages});
  localStorage.setItem('dreamy_products',JSON.stringify(products));
  render();
  document.getElementById('name').value=''; document.getElementById('desc').value=''; document.getElementById('preview').innerHTML=''; tempImages=[];
  alert('Product added! Now click Download products.json and upload it to GitHub.');
}
function render(){
  const list=document.getElementById('productList');
  list.innerHTML='<h3 style="color:#d4af37">Added Products ('+products.length+')</h3>';
  products.forEach((p,i)=>{
    list.innerHTML+=`<div class="item"><img src="${p.images[0]}"><div style="flex:1"><span class="cat-badge">${p.category}</span><div style="font-weight:bold;margin-top:5px">${p.name}</div><div style="font-size:13px;color:#aaa">${p.desc.substring(0,80)}</div></div><button onclick="removeProduct(${i})" style="width:auto;padding:8px 12px;background:#ff4444;color:#fff">X</button></div>`;
  });
}
function removeProduct(i){products.splice(i,1);localStorage.setItem('dreamy_products',JSON.stringify(products));render();}
function downloadJSON(){
  const dataStr="data:text/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(products,null,2));
  const a=document.createElement('a');a.href=dataStr;a.download="products.json";a.click();
}
function viewSite(){window.open('https://dreamy-designs.github.io/Dreamy-Designs/','_blank')}
render();
</script>
</body>
</html>
