<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dreamy Designs - Admin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#faf8f5;color:#2b2b2b}
.banner{height:220px;background:linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.6)),url('https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?auto=format&fit=crop&w=1920&q=80');background-size:cover;background-position:center;display:flex;flex-direction:column;align-items:center;justify-content:center;color:white;text-align:center}
.banner h1{font-size:42px;letter-spacing:5px;font-weight:900}
.banner p{margin-top:8px;letter-spacing:2px;color:#f5efe6}
.container{max-width:900px;margin:-30px auto 40px;background:white;padding:28px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,0.1);border:1px solid #f0e6d8}
label{display:block;margin-top:18px;font-weight:bold;color:#5a4a3a;font-size:14px;letter-spacing:0.5px}
select,input,textarea{width:100%;padding:12px;margin-top:6px;background:#faf8f5;border:1px solid #e8d5bc;border-radius:10px;box-sizing:border-box}
select{font-weight:600}
button.main{background:#2b2b2b;color:#f5efe6;padding:14px 24px;border:none;border-radius:10px;font-weight:bold;cursor:pointer;width:100%;margin-top:20px;font-size:16px;letter-spacing:0.5px}
button.main:hover{background:#000}
button.sec{background:white;color:#5a4a3a;border:1px solid #e8d5bc;padding:12px 24px;border-radius:10px;cursor:pointer;width:100%;margin-top:10px;font-weight:600}
.preview{margin-top:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.preview img{width:100%;height:110px;object-fit:cover;border-radius:10px;border:1px solid #e8d5bc}
.item{background:#faf8f5;padding:14px;border-radius:12px;margin-bottom:10px;display:flex;gap:14px;align-items:center;border:1px solid #f0e6d8}
.item img{width:70px;height:70px;object-fit:cover;border-radius:8px}
.badge{background:#2b2b2b;color:#f5efe6;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:bold}
</style>
</head>
<body>
<div class="banner">
<h1>DREAMY DESIGNS</h1>
<p>ADMIN PANEL — Handcrafted Laser Engraved Creations</p>
</div>
<div class="container">
<label>Category *</label>
<select id="category">
<option value="Home decor">Home decor</option>
<option value="Personalized gifts">Personalized gifts</option>
<option value="Pet tags & accessories">Pet tags & accessories</option>
<option value="Kitchen & serverware">Kitchen & serverware</option>
<option value="Signage & displays">Signage & displays</option>
<option value="Puzzles & educational">Puzzles & educational</option>
<option value="Industrial & prototyping">Industrial & prototyping</option>
</select>
<label>Product Name *</label>
<input id="name" placeholder="e.g. Custom Wooden Sign">
<label>Description</label>
<textarea id="desc" rows="3" placeholder="Tell customers about this product..."></textarea>
<label>Product Photos * (Multiple)</label>
<input type="file" id="photos" multiple accept="image/*">
<div id="preview" class="preview"></div>
<button class="main" onclick="addProduct()">+ Add Product to Website</button>
<button class="sec" onclick="downloadJSON()">💾 Download products.json (Upload to GitHub)</button>
<button class="sec" onclick="viewSite()">🌐 View Live Site</button>
<div id="productList" style="margin-top:28px"></div>
</div>
<script>
let products=JSON.parse(localStorage.getItem('dreamy_products')||'[]');let tempImages=[];
document.getElementById('photos').addEventListener('change',function(e){
 tempImages=[];document.getElementById('preview').innerHTML='';
 Array.from(e.target.files).forEach(file=>{const reader=new FileReader();reader.onload=function(ev){tempImages.push(ev.target.result);const img=document.createElement('img');img.src=ev.target.result;document.getElementById('preview').appendChild(img);};reader.readAsDataURL(file);});
});
function addProduct(){
 const cat=document.getElementById('category').value;const name=document.getElementById('name').value.trim();const desc=document.getElementById('desc').value.trim();
 if(!name||tempImages.length===0){alert('Add name + at least 1 photo!');return;}
 products.unshift({id:Date.now(),category:cat,name,desc,images:tempImages});localStorage.setItem('dreamy_products',JSON.stringify(products));render();
 document.getElementById('name').value='';document.getElementById('desc').value='';document.getElementById('preview').innerHTML='';tempImages=[];
 alert('Added! Now Download products.json and upload to GitHub.');
}
function render(){
 const list=document.getElementById('productList');list.innerHTML='<h3 style="margin-bottom:12px">Added Products ('+products.length+')</h3>';
 products.forEach((p,i)=>{list.innerHTML+=`<div class="item"><img src="${p.images[0]}"><div style="flex:1"><span class="badge">${p.category}</span><div style="font-weight:bold;margin-top:4px">${p.name}</div><div style="font-size:13px;color:#8a7a6a">${p.desc.substring(0,70)}</div></div><button onclick="removeProduct(${i})" style="width:auto;padding:8px 12px;background:#c94a4a;color:white;border:none;border-radius:8px;cursor:pointer">X</button></div>`;});
}
function removeProduct(i){products.splice(i,1);localStorage.setItem('dreamy_products',JSON.stringify(products));render();}
function downloadJSON(){const dataStr="data:text/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(products,null,2));const a=document.createElement('a');a.href=dataStr;a.download="products.json";a.click();}
function viewSite(){window.open('https://dreamy-designs.github.io/Dreamy-Designs/','_blank')}
render();
</script>
</body>
</html>
